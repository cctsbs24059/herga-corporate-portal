
# PostgreSQL configuration for HERGA Corporate Portal

default: &default
  adapter: postgresql
  encoding: unicode

  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

  host: <%= ENV.fetch("HERGA_DB_HOST") %>
  port: 5432

  username: <%= ENV.fetch("HERGA_DB_USER") %>
  password: <%= ENV.fetch("HERGA_DB_PASSWORD") %>

development:
  primary:
    <<: *default
    database: herga_portal_development

  queue:
    <<: *default
    database: herga_portal_development_queue
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: herga_portal_test

production:
  primary: &primary_production
    <<: *default
    database: herga_portal_production

  cache:
    <<: *primary_production
    database: herga_portal_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: herga_portal_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: herga_portal_production_cable
    migrations_paths: db/cable_migrate
