# HERGA Corporate Portal - Recurring Background Jobs
# Assessment job is registered but disabled by default via its environment flag.
development:
  infrastructure_connectivity_monitoring:
    class: Infrastructure::ScheduledConnectivityJob
    schedule: every 15 minutes
  infrastructure_stale_monitoring_recovery:
    class: Infrastructure::StaleMonitoringRunRecoveryJob
    schedule: every 5 minutes
  infrastructure_availability_assessment:
    class: Infrastructure::ScheduledAvailabilityAssessmentJob
    schedule: every hour
  infrastructure_notification_reconciliation:
    class: Infrastructure::NotificationReconciliationJob
    schedule: every 5 minutes


production:
  infrastructure_stale_monitoring_recovery:
    class: Infrastructure::StaleMonitoringRunRecoveryJob
    schedule: every 5 minutes
  infrastructure_availability_assessment:
    class: Infrastructure::ScheduledAvailabilityAssessmentJob
    schedule: every hour
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  infrastructure_notification_reconciliation:
    class: Infrastructure::NotificationReconciliationJob
    schedule: every 5 minutes


